<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Zendlijst</title>
    <style>
      :root { color-scheme: light dark; --paper: #faf6ee; --ink: #1c2333; --muted: #5b6478; --brand: #2b44b8; --accent: #f26b21; }
      @media (prefers-color-scheme: dark) { :root { --paper: #11141c; --ink: #edeae3; --muted: #9ba3b4; --brand: #8ea2ff; --accent: #ff8a4c; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; margin: 20px 0 8px; }
      h1 span { color: var(--accent); }
      p { color: var(--muted); margin: 4px 0; max-width: 28rem; }
      button { margin-top: 20px; border: 0; border-radius: 999px; padding: 10px 20px; background: var(--brand); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
      @media (prefers-color-scheme: dark) { button { color: #0e1430; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Je bent offline<span>.</span></h1>
      <p>Controleer je internetverbinding en probeer het opnieuw.</p>
      <p lang="en">You are offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Opnieuw proberen · Try again</button>
    </main>
  </body>
</html>
